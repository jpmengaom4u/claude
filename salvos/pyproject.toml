[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salvos"
version = "0.1.0"
description = "Organiza os posts salvos do Instagram por nicho, localmente."
requires-python = ">=3.11"
dependencies = [
    "instaloader>=4.13",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
salvos = "salvos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"salvos.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
